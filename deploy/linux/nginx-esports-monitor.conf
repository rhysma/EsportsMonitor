# For a Lightsail server that already runs nginx for other projects.
# 1. Copy to /etc/nginx/sites-available/esports-monitor and symlink into sites-enabled
# 2. Replace the hostname, then:  sudo nginx -t && sudo systemctl reload nginx
# 3. Add HTTPS:  sudo certbot --nginx -d esports-monitor.example.com
#    (certbot edits this file to add the certificate and an HTTP->HTTPS redirect)

server {
    listen 80;
    server_name esports-monitor.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
